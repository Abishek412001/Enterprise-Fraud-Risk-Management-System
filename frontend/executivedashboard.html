<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Executive C-Suite Dashboard · Enterprise Fraud Risk System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
</head>
<body data-theme="light">

<nav class="efrs-sidebar" id="sidebar">
  <div class="brand"><i class="bi bi-shield-lock-fill"></i> EFRS</div>
  <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
  <a class="nav-link active" href="executivedashboard.html"><i class="bi bi-pie-chart-fill"></i> Executive C-Suite</a>
  <a class="nav-link" href="metrics.html"><i class="bi bi-bar-chart-line-fill"></i> Fraud Metrics & BI</a>
  <a class="nav-link" href="reports.html"><i class="bi bi-file-earmark-text-fill"></i> Export Engine</a>
  <a class="nav-link" href="trendanalysis.html"><i class="bi bi-graph-up-arrow"></i> Trend Analytics</a>
  <a class="nav-link" href="analystperformance.html"><i class="bi bi-award-fill"></i> Analyst Performance</a>
  <a class="nav-link" href="users.html"><i class="bi bi-people-fill"></i> User RBAC</a>
  <a class="nav-link" href="auditlogs.html"><i class="bi bi-journal-check"></i> Audit Logs</a>
  <hr>
  <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right"></i> Logout</a>
</nav>

<main class="efrs-main">
  <div class="efrs-navbar">
    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0">Executive C-Suite Risk Dashboard</h5>
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-secondary btn-sm" id="themeToggle"><i class="bi bi-moon-fill"></i></button>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle"></i> <span id="navUsername">User</span>
        </button>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">
      <div class="efrs-stat-card d-flex justify-content-between align-items-center">
        <div>
          <div class="text-muted small">Total Open Alerts</div>
          <div class="stat-value text-danger" id="execOpenAlerts">--</div>
        </div>
        <div class="stat-icon" style="background:rgba(214,69,69,.12); color:#d64545;"><i class="bi bi-shield-exclamation"></i></div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="efrs-stat-card d-flex justify-content-between align-items-center">
        <div>
          <div class="text-muted small">Open Cases</div>
          <div class="stat-value text-warning" id="execOpenCases">--</div>
        </div>
        <div class="stat-icon" style="background:rgba(230,162,60,.15); color:#e6a23c;"><i class="bi bi-briefcase-fill"></i></div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="efrs-stat-card d-flex justify-content-between align-items-center">
        <div>
          <div class="text-muted small">SLA Compliance</div>
          <div class="stat-value text-success" id="execSla">98.4%</div>
        </div>
        <div class="stat-icon" style="background:rgba(22,163,122,.12); color:#16a37a;"><i class="bi bi-clock-history"></i></div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="efrs-stat-card d-flex justify-content-between align-items-center">
        <div>
          <div class="text-muted small">Loss Prevented</div>
          <div class="stat-value text-primary" id="execPrevented">$145,000</div>
        </div>
        <div class="stat-icon" style="background:rgba(28,63,170,.12); color:#1c3faa;"><i class="bi bi-cash-stack"></i></div>
      </div>
    </div>
  </div>

  <div class="efrs-panel">
    <h6 class="mb-3">Fraud Severity & Cross-Module Distribution</h6>
    <canvas id="execDistributionChart" height="100"></canvas>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="js/executivedashboard.js"></script>
</body>
</html>
