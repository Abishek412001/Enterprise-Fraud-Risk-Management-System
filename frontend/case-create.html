<main class="efrs-main">
  <div class="efrs-navbar">
    <div class="d-flex align-items-center gap-2">
      <a href="cases.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Cases</a>
      <h5 class="mb-0">Create Enterprise Fraud Investigation Case</h5>
    </div>
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-secondary btn-sm" id="themeToggle"><i class="bi bi-moon-fill"></i></button>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle"></i> <span id="navUsername">User</span>
        </button>
      </div>
    </div>
  </div>

  <div class="efrs-panel" style="max-width: 800px; margin: 0 auto;">
    <form id="createCaseForm">
      <div class="mb-3">
        <label for="customerSelect" class="form-label font-weight-bold">Target Customer</label>
        <select id="customerSelect" class="form-select" required>
          <option value="1">Customer ID 1 - John Doe</option>
          <option value="2">Customer ID 2 - Jane Smith</option>
        </select>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="caseType" class="form-label">Case Type</label>
          <select id="caseType" class="form-select" required>
            <option value="FraudInvestigation">Fraud Investigation</option>
            <option value="ATOInvestigation">Account Takeover (ATO)</option>
            <option value="SIEMIncident">SIEM Incident Correlation</option>
            <option value="Chargeback">Payment Chargeback</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="priority" class="form-label">Priority (SLA Target)</label>
          <select id="priority" class="form-select" required>
            <option value="Critical">Critical (2 Hours Target)</option>
            <option value="High" selected>High (8 Hours Target)</option>
            <option value="Medium">Medium (24 Hours Target)</option>
            <option value="Low">Low (72 Hours Target)</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label for="caseTitle" class="form-label">Case Title</label>
        <input type="text" id="caseTitle" class="form-control" placeholder="e.g., Suspicious Mule Account Activity & Card Fraud" required>
      </div>

      <div class="mb-3">
        <label for="caseDescription" class="form-label">Case Description & Background Context</label>
        <textarea id="caseDescription" class="form-control" rows="4" placeholder="Enter detailed investigation narrative, initial indicators, and transaction IDs..."></textarea>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="cases.html" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create Fraud Case</button>
      </div>
    </form>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/case-create.js"></script>
</body>
</html>
