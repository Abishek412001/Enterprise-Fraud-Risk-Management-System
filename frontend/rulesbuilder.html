<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fraud Rules Engine & Rule Builder · Enterprise Fraud Risk System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
</head>
<body data-theme="light">

<nav class="efrs-sidebar" id="sidebar">
  <div class="brand"><i class="bi bi-shield-lock-fill"></i> EFRS</div>
  <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
  <a class="nav-link active" href="rulesbuilder.html"><i class="bi bi-sliders"></i> Rules Engine</a>
  <a class="nav-link" href="executivedashboard.html"><i class="bi bi-pie-chart-fill"></i> Executive C-Suite</a>
  <a class="nav-link" href="metrics.html"><i class="bi bi-bar-chart-line-fill"></i> Fraud Metrics & BI</a>
  <hr>
  <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right"></i> Logout</a>
</nav>

<main class="efrs-main">
  <div class="efrs-navbar">
    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0">Enterprise Dynamic Fraud Rules Engine</h5>
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-secondary btn-sm" id="themeToggle"><i class="bi bi-moon-fill"></i></button>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle"></i> <span id="navUsername">User</span>
        </button>
      </div>
    </div>
  </div>

  <div class="efrs-panel mb-3">
    <h6 class="mb-3 border-bottom pb-2"><i class="bi bi-plus-circle text-primary me-2"></i>Configure New Fraud Rule</h6>
    <form id="ruleForm">
      <div class="row g-2 mb-2">
        <div class="col-md-3"><input type="text" id="ruleCode" class="form-control form-control-sm" placeholder="Rule Code (e.g. RULE-105)" required></div>
        <div class="col-md-5"><input type="text" id="ruleName" class="form-control form-control-sm" placeholder="Rule Name" required></div>
        <div class="col-md-4">
          <select id="ruleCategory" class="form-select form-select-sm">
            <option value="Velocity">Velocity</option>
            <option value="ATO">Account Takeover</option>
            <option value="Location">Location & Impossible Travel</option>
            <option value="Device">Device Fingerprinting</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <input type="text" id="ruleCondition" class="form-control form-control-sm" placeholder="Condition Expression (e.g. Amount > 5000 AND Country != 'USA')" required>
      </div>
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check-lg"></i> Deploy Fraud Rule</button>
    </form>
  </div>

  <div class="efrs-panel">
    <h6 class="mb-3 border-bottom pb-2">Active Fraud Rules Registry</h6>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr><th>Code</th><th>Name</th><th>Category</th><th>Condition Expression</th><th>Weight</th><th>Action</th><th>Status</th></tr>
        </thead>
        <tbody id="rulesTableBody">
          <tr><td colspan="7" class="text-muted text-center py-4">Loading active fraud rules...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/rulesbuilder.js"></script>
</body>
</html>
