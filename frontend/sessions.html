<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Session Log Monitoring · Enterprise Fraud Risk System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
</head>
<body data-theme="light">

<nav class="efrs-sidebar" id="sidebar">
  <div class="brand"><i class="bi bi-shield-lock-fill"></i> EFRS</div>
  <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
  <a class="nav-link" href="frmalerts.html"><i class="bi bi-shield-exclamation"></i> FRM Alerts</a>
  <a class="nav-link" href="atoalerts.html"><i class="bi bi-person-bounding-box"></i> ATO Alerts</a>
  <a class="nav-link" href="devices.html"><i class="bi bi-laptop"></i> Devices</a>
  <a class="nav-link active" href="sessions.html"><i class="bi bi-activity"></i> Sessions</a>
  <a class="nav-link" href="fraudalerts.html"><i class="bi bi-exclamation-triangle-fill"></i> Legacy Alerts</a>
  <a class="nav-link" href="customers.html"><i class="bi bi-people-fill"></i> Customers</a>
  <a class="nav-link" href="accounts.html"><i class="bi bi-wallet2"></i> Accounts</a>
  <a class="nav-link" href="cards.html"><i class="bi bi-credit-card-2-front-fill"></i> Cards</a>
  <a class="nav-link" href="transactions.html"><i class="bi bi-arrow-left-right"></i> Transactions</a>
  <a class="nav-link" href="reports.html"><i class="bi bi-file-earmark-bar-graph-fill"></i> Reports</a>
  <hr>
  <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right"></i> Logout</a>
</nav>

<main class="efrs-main">
  <div class="efrs-navbar">
    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0">Customer Session Activity Logs</h5>
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-secondary btn-sm" id="themeToggle"><i class="bi bi-moon-fill"></i></button>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle"></i> <span id="navUsername">User</span>
        </button>
      </div>
    </div>
  </div>

  <div class="efrs-panel mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-6 col-md-3">
        <select id="statusFilter" class="form-select form-select-sm">
          <option value="">All Session Statuses</option>
          <option value="Success">Success</option>
          <option value="Failed">Failed</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <button class="btn btn-primary btn-sm w-100" id="btnFilter"><i class="bi bi-funnel"></i> Apply Filter</button>
      </div>
    </div>
  </div>

  <div class="efrs-panel">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Session ID</th>
            <th>Customer</th>
            <th>IP Address</th>
            <th>Country</th>
            <th>Browser / OS</th>
            <th>Login Time</th>
            <th>Status</th>
            <th>Risk Score</th>
          </tr>
        </thead>
        <tbody id="sessionsTableBody">
          <tr><td colspan="8" class="text-muted text-center py-4">Loading sessions...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/sessions.js"></script>
</body>
</html>
