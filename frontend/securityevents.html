<link href="css/dashboard.css" rel="stylesheet">
</head>
<body data-theme="light">

<nav class="efrs-sidebar" id="sidebar">
  <div class="brand"><i class="bi bi-shield-lock-fill"></i> EFRS</div>
  <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>

  <a class="nav-link" href="atoalerts.html"><i class="bi bi-person-bounding-box"></i> ATO Alerts</a>
  <a class="nav-link" href="sentinelalerts.html"><i class="bi bi-cpu"></i> Sentinel SIEM</a>
  <a class="nav-link active" href="securityevents.html"><i class="bi bi-journal-code"></i> Security Events</a>
  <a class="nav-link" href="threatindicators.html"><i class="bi bi-bug-fill"></i> Threat Intel</a>
  <a class="nav-link" href="devices.html"><i class="bi bi-laptop"></i> Devices</a>
  <a class="nav-link" href="sessions.html"><i class="bi bi-activity"></i> Sessions</a>

  <a class="nav-link" href="customers.html"><i class="bi bi-people-fill"></i> Customers</a>
  <a class="nav-link" href="accounts.html"><i class="bi bi-wallet2"></i> Accounts</a>
  <a class="nav-link" href="cards.html"><i class="bi bi-credit-card-2-front-fill"></i> Cards</a>
  <a class="nav-link" href="transactions.html"><i class="bi bi-arrow-left-right"></i> Transactions</a>
  <a class="nav-link" href="reports.html"><i class="bi bi-file-earmark-bar-graph-fill"></i> Reports</a>
  <hr>
  <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right"></i> Logout</a>
</nav>

<main class="efrs-main">
  <div class="efrs-navbar">
    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0">SIEM Security Event Logs</h5>
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-secondary btn-sm" id="themeToggle"><i class="bi bi-moon-fill"></i></button>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle"></i> <span id="navUsername">User</span>
        </button>
      </div>
    </div>
  </div>

  <div class="efrs-panel mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-md-4">
        <select id="typeFilter" class="form-select form-select-sm">
          <option value="">All Security Event Types</option>
          <option value="BruteForceLogin">BruteForceLogin</option>
          <option value="RansomwareActivity">RansomwareActivity</option>
          <option value="PrivilegeEscalation">PrivilegeEscalation</option>
          <option value="PowerShellExecution">PowerShellExecution</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <button class="btn btn-primary btn-sm w-100" id="btnFilter"><i class="bi bi-funnel"></i> Apply Filter</button>
      </div>
    </div>
  </div>

  <div class="efrs-panel">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>IP Address</th>
            <th>Event Type</th>
            <th>Result</th>
            <th>Application / OS</th>
            <th>Event Time</th>
          </tr>
        </thead>
        <tbody id="eventsTableBody">
          <tr><td colspan="7" class="text-muted text-center py-4">Loading security event logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/securityevents.js"></script>
</body>
</html>
