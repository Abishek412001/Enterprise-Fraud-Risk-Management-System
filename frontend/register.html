<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register · Enterprise Fraud Risk Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand">
      <i class="bi bi-shield-lock-fill"></i>
      <span>Enterprise Fraud Risk System</span>
    </div>
    <h5 class="mb-3">Create an account</h5>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" id="username" required minlength="3">
        <div class="form-error" id="usernameError"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" required>
        <div class="form-error" id="emailError"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" required minlength="8">
        <div class="form-error" id="passwordError"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="role">Role</label>
        <select class="form-select" id="role" required>
          <option value="FraudAnalyst" selected>Fraud Analyst</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <div class="form-error mb-2" id="formError"></div>
      <button type="submit" class="btn btn-efrs-primary w-100" id="registerBtn">
        <span id="registerBtnText">Create Account</span>
        <span id="registerSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>

    <div class="auth-footer-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/register.js"></script>
</body>
</html>
